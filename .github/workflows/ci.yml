name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Pure-NumPy deps only. mfem (PyMFEM) and dolfinx/dolfinx_mpc are
      # conda-forge prerequisites, not pip extras (see notes/claude.md), so the
      # tests they gate auto-skip here via tests/conftest.py. Run against the
      # source tree with PYTHONPATH=src instead of `pip install .` to avoid
      # dragging in the heavy FE backends.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pyyaml treeparse matplotlib pytest

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - run: ruff check --output-format=github src tests
