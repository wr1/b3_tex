name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly DOLFINx job only (see test-fenicsx). Not a push trigger.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      # [test] does not pull mfem. DOLFINx is conda-only and is not installed.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: python -m pytest -q

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        env:
          COVERAGE_FILE: coverage-pure.data
        run: |
          python -m pytest -q \
            --cov=b3_tex \
            --cov-report=xml:coverage-pure.xml

      - name: Upload pure-Python coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pure
          path: coverage-pure.data

  test-mfem:
    name: test (mfem, py3.12)
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
      COVERAGE_FILE: coverage-mfem.data
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mfem]"

      - name: Run tests
        run: |
          python -m pytest -q -m "not fenicsx" \
            --cov=b3_tex \
            --cov-report=xml:coverage-mfem.xml

      - name: Upload MFEM coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-mfem
          path: coverage-mfem.data

  coverage:
    name: coverage badge
    runs-on: ubuntu-latest
    needs: [test, test-mfem]
    permissions:
      contents: write
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-parts

      # Pure-Python 3.12 + test-mfem. DOLFINx files stay out of the badge.
      - name: Combine and gate
        run: |
          mkdir -p coverage-combine
          cp coverage-parts/coverage-pure/coverage-pure.data coverage-combine/.coverage.pure
          cp coverage-parts/coverage-mfem/coverage-mfem.data coverage-combine/.coverage.mfem
          cd coverage-combine
          python -m coverage combine
          python -m coverage xml -o "$GITHUB_WORKSPACE/coverage.xml" \
            --omit='*/b3_tex/backends/dolfinx*.py,*/b3_tex/backends/*_dolfinx*'
          python -m coverage report --fail-under=60 \
            --omit='*/b3_tex/backends/dolfinx*.py,*/b3_tex/backends/*_dolfinx*'

      - name: Write coverage badge SVG
        run: |
          python <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          pct = int(round(rate * 100))
          if pct >= 90:
              color = "#4c1"
          elif pct >= 75:
              color = "#97ca00"
          elif pct >= 60:
              color = "#a4a61d"
          elif pct >= 40:
              color = "#dfb317"
          else:
              color = "#e05d44"
          label, message = "coverage", f"{pct}%"
          lw, mw = 64, 42
          w = lw + mw
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="20" role="img" aria-label="{label}: {message}">
            <title>{label}: {message}</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r"><rect width="{w}" height="20" rx="3" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="{lw}" height="20" fill="#555"/>
              <rect x="{lw}" width="{mw}" height="20" fill="{color}"/>
              <rect width="{w}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
              <text aria-hidden="true" x="{lw/2*10}" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="{(lw-10)*10}">{label}</text>
              <text x="{lw/2*10}" y="140" transform="scale(.1)" fill="#fff" textLength="{(lw-10)*10}">{label}</text>
              <text aria-hidden="true" x="{(lw+mw/2)*10}" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="{(mw-10)*10}">{message}</text>
              <text x="{(lw+mw/2)*10}" y="140" transform="scale(.1)" fill="#fff" textLength="{(mw-10)*10}">{message}</text>
            </g>
          </svg>
          '''
          out = Path("docs/badges/coverage.svg")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(svg)
          print(f"coverage badge → {pct}%")
          PY

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "ci: update coverage badge [skip ci]"
          file_pattern: docs/badges/coverage.svg
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      # Optional: set repo secret CODECOV_TOKEN after enabling the repo on codecov.io
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          name: b3_tex-py3.12-mfem
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  fenicsx-paths:
    name: dolfinx path filter
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -E 'src/b3_tex/backends/(dolfinx|_dolfinx_common\.py|_amr_dolfinx\.py)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test-fenicsx:
    name: test (fenicsx)
    runs-on: ubuntu-latest
    needs: fenicsx-paths
    # Not on every push: weekly cron, manual dispatch, or a dolfinx-path change.
    # always(): fenicsx-paths is skipped on schedule / workflow_dispatch.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       needs.fenicsx-paths.outputs.run == 'true')
    steps:
      - uses: actions/checkout@v7

      # Sketch: conda-forge FE stack. numpy ABI vs constraints/ci.txt is not
      # pinned here so a conda numpy required by fenics-dolfinx is left alone.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: b3-tex
          channels: conda-forge
          create-args: >-
            python=3.12
            fenics-dolfinx
            dolfinx_mpc
            mpich
          cache-environment: true

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run DOLFINx tests
        run: python -m pytest -q -m fenicsx

  lint:
    name: lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

      - name: Import contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . import-linter
          lint-imports
