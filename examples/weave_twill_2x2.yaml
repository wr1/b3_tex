# 2/2 twill carbon/epoxy fabric.  units: m (SI)
# Mirrors louisepb/TexGenScripts 2dweave.py (CTextileWeave2D + SwapPosition), with
# the diagonal interlacing expressed as a WeavePattern.twill instead of swap calls.
# TexGen mm dimensions mapped to metres: spacing 5 mm -> 0.005, width 4 mm -> 0.004,
# height 0.8 mm -> 0.0008, thickness ~2 mm.
#
# Solver defaults follow SKILL.md §4 (mfem-periodic hex + AMR): moderate base mesh
# refined at yarn/matrix interfaces. For a faster smoke run (~10 s), set
# mesh_resolution to [20, 20, 5] and amr.enabled: false.
#
# Agent path:
#   b3-tex validate examples/weave_twill_2x2.yaml
#   b3-tex solve examples/weave_twill_2x2.yaml -o results/weave_twill_2x2
#   b3-tex datasheet examples/weave_twill_2x2.yaml \
#       -o results/datasheet_weave_twill_2x2.pdf \
#       --c-eff results/weave_twill_2x2/C_eff.npz

domain:
  size: [0.02, 0.02, 0.0024]      # 4 x 4 tows at 5 mm pitch; ~2.4 mm thick
  mesh_resolution: [24, 24, 6]    # standard quality; was [48,48,10] uniform (slow)

periodic_tolerance: 1.0e-8

materials:
  - {name: matrix, type: isotropic, youngs_modulus: 3.5e9, poisson_ratio: 0.35}
  - {name: fibre, type: transverse_isotropic, e_l: 230.0e9, e_t: 15.0e9, g_lt: 15.0e9, nu_lt: 0.20, nu_tt: 0.30}
  - {name: yarn, type: micromechanical, matrix: matrix, fibre: fibre, micromodel: chamis,
     nominal_fibre_volume_fraction: 0.55, max_fibre_volume_fraction: 0.90}

field:
  type: woven
  matrix_material: matrix
  yarn_material: yarn
  domain_size: [0.02, 0.02, 0.0024]
  pattern: {kind: twill, n_over: 2, n_under: 2, step: 1, n_warp: 4, n_weft: 4}
  warp_width: 0.004
  warp_height: 0.0008
  power: 4.0
  compaction: 0.3
  nest: true
  nominal_fibre_volume_fraction: 0.55
  max_fibre_volume_fraction: 0.90

solver:
  backend: mfem-periodic
  cell_type: hexahedron
  material_sampling: {strategy: local_cloud, resolution: 6}
  amr:
    enabled: true
    max_iterations: 2
    threshold: 0.2
    dof_budget: 200000
