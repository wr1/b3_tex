[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b3-tex"
version = "0.1.0"
description = "Implicit modelling and periodic homogenization of textile composite RVEs on FEniCSx."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wr1" }]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "treeparse>=0.2.5",
  "scipy>=1.10",
  "mfem",       # PyMFEM — required for the recommended default mfem-* backends
  "numba>=0.59",  # offline MFEM elasticity CSR assembly (solver.assembly=numba)
  "matplotlib>=3.7",  # common plotting dep for examples, convergence studies, and result visualization
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
viz = [
  "pyvista>=0.43",      # 3D scene: volume render, level-set isosurface, glyphs
  "pillow>=10.0",       # overview() panel compositing
  "imageio>=2.30",      # animation frame I/O (orbit / amr / section sweeps)
  "imageio-ffmpeg>=0.4", # mp4 via imageio (the explainer also uses the ffmpeg CLI)
  # matplotlib and scipy are already core dependencies; scikit-image is optional
]

[project.scripts]
b3-tex = "b3_tex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/b3_tex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "fenicsx: requires a working DOLFINx and dolfinx_mpc installation",
  "mfem: requires a working PyMFEM (mfem) installation (now a core dependency)",
]

[tool.ruff.lint]
# E741: single-letter names (l, n, m, k) match geometry / micromechanics notation.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Examples manipulate sys.path before importing; some tests guard FE imports.
"examples/*" = ["E402"]
"tests/test_dolfinx_periodic_solve.py" = ["E402"]
"tests/test_dolfinx_solve.py" = ["E402"]
"tests/test_mfem.py" = ["E402"]
