# Install once: pre-commit install
# Run on all files: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests|examples)/
      - id: ruff-format
        files: ^(src|tests|examples)/
